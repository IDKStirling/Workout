<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRENCH — Training Log</title>
<meta name="theme-color" content="#0B0C0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TRENCH">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#0B0C0F;--surface:#15171C;--raised:#1C1F26;--raised2:#252932;--hair:rgba(255,255,255,.07);--hair2:rgba(255,255,255,.13);
  --text:#F4F5F7;--muted:#A1A6B0;--faint:#6C717B;--accent:#FF5A26;--accent2:#FF8A3D;--accent-soft:rgba(255,90,38,.14);--accent-line:rgba(255,90,38,.45);
  --good:#34D399;--good-soft:rgba(52,211,153,.14);--warn:#FBBF24;--bad:#FF453A;--bad-soft:rgba(255,69,58,.14);--blue:#60A5FA;--gold:#F5C04E;
  --shadow:0 12px 32px rgba(0,0,0,.45);--r-card:20px;--r-in:14px;--nav-h:76px;
  --m-sil:#232731;--m-base:#3a414d;--m-neutral:#313741;--m-line:#15171C;--m-prim:#FF3B30;--m-sec-bg:#5a3a33;--m-sec-ln:#FF8A5B;
  --disp:'Space Grotesk',system-ui,sans-serif;--body:'Inter',system-ui,-apple-system,sans-serif;--mono:'Roboto Mono',ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F2F3F6;--surface:#FFFFFF;--raised:#F1F3F6;--raised2:#E5E8ED;--hair:rgba(12,18,32,.08);--hair2:rgba(12,18,32,.15);
  --text:#10131A;--muted:#535A66;--faint:#8A909B;--accent:#EE4E14;--accent-soft:rgba(238,78,20,.10);--accent-line:rgba(238,78,20,.40);
  --good:#0F9F6E;--good-soft:rgba(15,159,110,.12);--shadow:0 10px 28px rgba(20,30,50,.12);
  --m-sil:#DCE0E7;--m-base:#BEC5D0;--m-neutral:#CCD2DA;--m-line:#FFFFFF;--m-sec-bg:#FFD6C7;--m-sec-ln:#FF7A45;color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#F2F3F6;--surface:#FFFFFF;--raised:#F1F3F6;--raised2:#E5E8ED;--hair:rgba(12,18,32,.08);--hair2:rgba(12,18,32,.15);
  --text:#10131A;--muted:#535A66;--faint:#8A909B;--accent:#EE4E14;--accent-soft:rgba(238,78,20,.10);--accent-line:rgba(238,78,20,.40);
  --good:#0F9F6E;--good-soft:rgba(15,159,110,.12);--shadow:0 10px 28px rgba(20,30,50,.12);
  --m-sil:#DCE0E7;--m-base:#BEC5D0;--m-neutral:#CCD2DA;--m-line:#FFFFFF;--m-sec-bg:#FFD6C7;--m-sec-ln:#FF7A45;color-scheme:light;}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--text)}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--hair)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;padding-top:env(safe-area-inset-top)}
.wordmark{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:.06em}.wordmark i{color:var(--accent);font-style:normal}
.lvchip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--hair);font-size:12px;font-weight:600}
.lvchip .ring{width:26px;height:26px}
main{padding:18px 0 calc(var(--nav-h) + 40px)}
.view{display:none;animation:viewIn .28s cubic-bezier(.2,.7,.3,1)}.view.active{display:block}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ptitle{font-size:27px;font-weight:700;line-height:1.1}.psub{color:var(--muted);font-size:13.5px;margin-top:4px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.sec{margin-top:26px}.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sec-h h3{font-size:17px}.sec-h .lnk{font-size:13px;color:var(--accent);font-weight:600}
/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-card);padding:16px}
.card+.card{margin-top:10px}
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--accent) 22%,transparent) 0%,transparent 55%),var(--surface);border:1px solid var(--accent-line)}
.hero.rest{background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--good) 20%,transparent) 0%,transparent 55%),var(--surface);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.hero .tag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.hero.rest .tag{color:var(--good)}
.hero h2{font-size:25px;margin:6px 0 4px;line-height:1.12}.hero .meta{color:var(--muted);font-size:13.5px}
.hero-row{display:flex;gap:14px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:12px;min-width:0}
.tile .v{font-family:var(--disp);font-size:22px;font-weight:700;line-height:1.1;white-space:nowrap}.tile .l{font-size:11.5px;color:var(--muted);margin-top:3px}
.ring{transform:rotate(-90deg)}.ring .bgc{stroke:var(--raised2)}.ring .fgc{stroke:var(--accent);transition:stroke-dashoffset .9s cubic-bezier(.2,.7,.3,1)}
.ring.good .fgc{stroke:var(--good)}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;font-weight:650;font-size:15px;background:var(--raised);border:1px solid var(--hair2);transition:transform .12s,background .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.good{background:var(--good);border-color:transparent;color:#05140e}
.btn.ghost{background:transparent;border-color:var(--hair2)}
.btn.danger{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.btn.lg{height:56px;font-size:16.5px;border-radius:16px}.btn.sm{height:36px;padding:0 13px;font-size:13.5px;border-radius:11px}.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--raised);border:1px solid var(--hair);flex:0 0 auto}
.ibtn svg,.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--raised);border:1px solid var(--hair);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.rec-badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:999px;background:var(--good-soft);color:var(--good);border:1px solid color-mix(in srgb,var(--good) 45%,transparent)}
.tagx{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--raised2);color:var(--muted)}
.seg{display:flex;background:var(--raised);border:1px solid var(--hair);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);transition:.15s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.25)}
/* ---------- lists ---------- */
.list{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-card);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--hair);background:var(--surface);position:relative}
.row:last-child{border-bottom:0}.row.tap{cursor:pointer}.row.tap:active{background:var(--raised)}
.row .grow{flex:1;min-width:0}.row .t{font-weight:600;font-size:14.5px}.row .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.row .chev{color:var(--faint);width:16px;height:16px}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--raised);font-size:18px;flex:0 0 auto}
.ico svg{width:19px;height:19px;color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:28px 16px;font-size:14px}
/* ---------- week strip ---------- */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wkd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 8px;border-radius:14px;background:var(--surface);border:1px solid var(--hair);cursor:pointer;transition:.15s;min-width:0}
.wkd .d{font-size:10.5px;color:var(--faint);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.wkd .n{font-family:var(--disp);font-weight:700;font-size:13px;white-space:nowrap}
.wkd .dot{width:7px;height:7px;border-radius:50%;background:var(--raised2)}
.wkd.rest .n{color:var(--faint);font-weight:500}
.wkd.done .dot{background:var(--good)}.wkd.today{border-color:var(--accent-line)}.wkd.today .d{color:var(--accent)}
.wkd.sel{background:var(--accent-soft);border-color:var(--accent)}
/* ---------- plan exercise rows ---------- */
.exlist{display:flex;flex-direction:column;gap:8px}
.exrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:12px 12px 12px 14px;cursor:pointer}
.exrow:active{background:var(--raised)}
.exrow .num{font-family:var(--mono);font-size:11px;color:var(--faint);width:18px}
.exrow .nm{font-weight:650;font-size:14.5px;line-height:1.25}.exrow .pr{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:3px}
.exrow .nx{text-align:right;flex:0 0 auto}.exrow .nx .w{font-family:var(--disp);font-weight:700;font-size:15px}.exrow .nx .st{font-size:11px;margin-top:2px;color:var(--muted)}
.st.up{color:var(--good)}.st.deload{color:var(--warn)}
.ssgrp{border-left:3px solid var(--accent);padding-left:9px;display:flex;flex-direction:column;gap:6px}
.sslabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;font-weight:700}
.edited{font-family:var(--mono);font-size:9.5px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);border-radius:5px;padding:0 4px;margin-left:6px;vertical-align:2px}
/* ---------- bottom nav ---------- */
nav.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom)}
nav.bnav .in{max-width:600px;margin:0 auto;display:flex;height:var(--nav-h);align-items:center;padding:0 6px}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--faint);padding:6px 0;transition:color .15s}
.nb .ni{width:44px;height:30px;border-radius:11px;display:grid;place-items:center;transition:.18s}
.nb svg{width:22px;height:22px}
.nb.on{color:var(--accent)}.nb.on .ni{background:var(--accent-soft)}
.nb{position:relative}.nb .livedot{position:absolute;top:6px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
/* ---------- session ---------- */
.sess-top{position:sticky;top:58px;z-index:20;background:var(--bg);padding:10px 0 8px;margin-top:-18px}
.sess-top .r1{display:flex;align-items:center;gap:10px}
.sess-top .nm{flex:1;min-width:0}.sess-top .nm b{display:block;font-family:var(--disp);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-top .nm span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.dots{display:flex;gap:4px;margin-top:10px}.dots i{flex:1;height:4px;border-radius:3px;background:var(--raised2);transition:.25s}
.dots i.done{background:var(--good)}.dots i.cur{background:var(--accent)}
.excard{background:var(--surface);border:1px solid var(--hair);border-radius:22px;padding:16px;margin-top:10px;animation:cardIn .3s cubic-bezier(.2,.7,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.excard .exh{display:flex;align-items:flex-start;gap:10px}.excard .exh h2{font-size:21px;line-height:1.15;flex:1}
.presc{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:4px}
.ssban{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--text);border-radius:12px;padding:8px 11px;font-size:12.5px;margin-top:12px}
.ssban b{color:var(--accent)}
.cuebox{margin-top:12px;font-size:13px;color:var(--muted);border-left:2px solid var(--accent-line);padding-left:10px}
.sets{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.sethead{display:grid;grid-template-columns:30px 1fr 1fr 74px 48px;gap:8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:0 4px}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 74px 48px;gap:8px;align-items:center;background:var(--raised);border:1px solid var(--hair);border-radius:14px;padding:8px 6px 8px 8px;transition:background .2s,border-color .2s}
.setrow.cur{border-color:var(--accent-line);background:color-mix(in srgb,var(--accent) 7%,var(--raised))}
.setrow.done{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.setrow .sn{font-family:var(--mono);font-weight:700;font-size:13px;text-align:center;color:var(--muted)}
.setrow .rec{font-size:11.5px;line-height:1.2}.setrow .rec b{display:block;font-family:var(--disp);font-size:15px;color:var(--text)}
.setrow .rec span{color:var(--faint)}.setrow .rec .adj{color:var(--accent);font-weight:700}
.nin{width:100%;height:42px;border-radius:11px;border:1px solid var(--hair2);background:var(--surface);text-align:center;font-family:var(--disp);font-weight:700;font-size:16px;padding:0 4px;-moz-appearance:textfield}
.nin::-webkit-outer-spin-button,.nin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.nin:focus{outline:none;border-color:var(--accent)}
.ck{width:44px;height:42px;border-radius:12px;border:2px solid var(--hair2);display:grid;place-items:center;transition:.18s;color:transparent}
.ck svg{width:22px;height:22px}
.setrow.done .ck{background:var(--good);border-color:var(--good);color:#05140e;animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.effort{grid-column:2/-1;display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}
.effort button{padding:5px 10px;border-radius:999px;border:1px solid var(--hair2);font-size:12px;font-weight:600;color:var(--muted)}
.effort button.on{background:var(--text);color:var(--bg);border-color:transparent}
.calnote{grid-column:1/-1;font-size:12px;color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:9px;padding:7px 9px;line-height:1.4}
.setops{display:flex;gap:8px;margin-top:10px}
.sess-nav{display:flex;gap:10px;margin-top:14px}
.restbar{position:fixed;left:50%;transform:translateX(-50%) translateY(40px);opacity:0;visibility:hidden;pointer-events:none;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);width:min(568px,calc(100% - 24px));z-index:45;background:var(--text);color:var(--bg);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.7,.3,1),opacity .25s,visibility .35s;overflow:hidden}
.restbar.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;pointer-events:auto}
body.resting main{padding-bottom:calc(var(--nav-h) + 150px)}
body.resting .toast{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 92px)}
.setrow{scroll-margin:110px 0 170px}
.restbar .fill{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width 1s linear}
.restbar .t{font-family:var(--disp);font-weight:700;font-size:26px;min-width:70px}.restbar .l{flex:1;font-size:12.5px;line-height:1.3}.restbar .l b{display:block;font-size:13.5px}
.restbar button{height:34px;padding:0 11px;border-radius:10px;background:color-mix(in srgb,var(--bg) 12%,transparent);font-weight:700;font-size:13px}
.restbar.done{background:var(--good);color:#05140e}
/* ---------- summary ---------- */
.sumhero{text-align:center;padding:26px 10px 10px}
.bigcheck{width:84px;height:84px;border-radius:50%;background:var(--good);display:grid;place-items:center;margin:0 auto 14px;color:#05140e;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.bigcheck svg{width:44px;height:44px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.xpbar{height:10px;border-radius:6px;background:var(--raised2);overflow:hidden;margin-top:8px}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;transition:width 1.2s cubic-bezier(.2,.7,.3,1)}
.levelup{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:16px;padding:14px;text-align:center;font-family:var(--disp);font-weight:700;font-size:19px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.prline{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--gold) 12%,transparent);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);margin-top:8px;font-size:14px}
.prline b{color:var(--gold);font-family:var(--mono);font-size:11px;letter-spacing:.08em}
/* ---------- progress ---------- */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{width:100%;aspect-ratio:1;border-radius:4px;background:var(--raised2)}.heat i.on{background:var(--accent)}.heat i.rest{background:var(--raised)}.heat i.today{outline:2px solid var(--text);outline-offset:1px}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:12px 8px;text-align:center}
.bdg .e{font-size:26px;filter:grayscale(1);opacity:.45}.bdg.got .e{filter:none;opacity:1}
.bdg .n{font-size:12px;font-weight:650;margin-top:4px;line-height:1.2}.bdg .p{height:4px;border-radius:3px;background:var(--raised2);margin-top:7px;overflow:hidden}.bdg .p i{display:block;height:100%;background:var(--accent)}
.bdg.got{border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--faint);font-size:10px;font-family:var(--mono)}
.chart .grid{stroke:var(--hair)}.chart .bar{fill:var(--accent)}.chart .bar.dim{fill:var(--raised2)}.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}.chart .area{fill:url(#cgrad)}
/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}.field>label{font-size:12.5px;color:var(--muted);font-weight:600}
.inp{height:46px;border-radius:13px;border:1px solid var(--hair2);background:var(--raised);padding:0 13px;font-size:15px;width:100%}
.inp:focus{outline:none;border-color:var(--accent)}textarea.inp{height:auto;min-height:74px;padding:11px 13px;resize:vertical}
.frow{display:flex;gap:10px}.frow>*{flex:1;min-width:0}
.switch{width:50px;height:30px;border-radius:999px;background:var(--raised2);position:relative;transition:.2s;flex:0 0 auto}
.switch::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:var(--good)}.switch.on::after{left:23px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.callout{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5}
.callout.good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.callout.warn{background:color-mix(in srgb,var(--warn) 11%,transparent);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
/* ---------- sheets & pages ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,0);transition:background .3s;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap.show{background:rgba(0,0,0,.55)}
.sheet{width:100%;max-width:640px;max-height:92vh;background:var(--bg);border-radius:24px 24px 0 0;border:1px solid var(--hair2);border-bottom:0;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.25,1);display:flex;flex-direction:column;overflow:hidden}
.sheet-wrap.show .sheet{transform:none}
.sheet-h{display:flex;align-items:center;gap:10px;padding:10px 16px 10px;border-bottom:1px solid var(--hair);position:relative}
.sheet-h::before{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:3px;background:var(--hair2)}
.sheet-h h3{flex:1;font-size:17px;padding-top:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-h .ibtn{margin-top:8px}
.sheet-b{overflow-y:auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.page{position:fixed;inset:0;z-index:50;background:var(--bg);transform:translateX(100%);transition:transform .36s cubic-bezier(.2,.8,.25,1);display:flex;flex-direction:column}
.page.show{transform:none}
.page-top{display:flex;align-items:center;gap:10px;height:58px;padding:env(safe-area-inset-top) 12px 0;border-bottom:1px solid var(--hair);flex:0 0 auto;max-width:600px;width:100%;margin:0 auto}
.page-top h3{flex:1;font-size:18px}
.page-b{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}.page-b>.wrap{padding-top:14px;padding-bottom:40px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:650;color:var(--muted);background:var(--surface);border:1px solid var(--hair);white-space:nowrap}
.tabs button.on{background:var(--text);color:var(--bg);border-color:transparent}
/* ---------- exercise detail / demo ---------- */
.demo{position:relative;width:100%;aspect-ratio:4/3.2;border-radius:18px;overflow:hidden;background:radial-gradient(120% 100% at 50% 0%,#20242c 0%,#0d0e12 75%);border:1px solid var(--hair)}
.demo canvas{display:block;width:100%!important;height:100%!important;touch-action:pan-y}
.demo .phase{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.55);color:#fff;padding:5px 9px;border-radius:8px;backdrop-filter:blur(6px)}
.demo .phase.fin{background:var(--accent)}
.demo .dctl{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:8px}
.demo .dctl button{height:32px;min-width:32px;padding:0 9px;border-radius:9px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;backdrop-filter:blur(6px);display:grid;place-items:center}
.demo .dctl button.on{background:#fff;color:#000}
.demo .dctl input[type=range]{flex:1;accent-color:var(--accent)}
.demo .hint{position:absolute;right:10px;top:10px;font-size:10.5px;color:rgba(255,255,255,.6)}
.demo .fallback{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:13px;text-align:center;padding:20px}
.mmap{display:flex;gap:8px;justify-content:center}.mmap figure{margin:0;flex:1;max-width:190px}
.mmap figcaption{font-size:10.5px;text-align:center;color:var(--faint);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.mmap.compact figure{max-width:90px}
.msvg{width:100%;display:block}.sil{fill:var(--m-sil)}.mu path{fill:var(--m-base);stroke:var(--m-line);stroke-width:1.1}
.mu.neutral path{fill:var(--m-neutral)}.mu.prim path{fill:var(--m-prim);animation:mpulse 2.2s ease-in-out infinite}.mu.sec path{fill:url(#mhatch)}
.mh-bg{fill:var(--m-sec-bg)}.mh-ln{fill:var(--m-sec-ln)}
@keyframes mpulse{50%{opacity:.78}}
.mlegend{display:flex;flex-direction:column;gap:8px;margin-top:10px;font-size:12.5px}
.mlegend>div{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.mlegend b{margin-right:4px}
.mkey{width:14px;height:14px;border-radius:4px;display:inline-block}.mkey.prim{background:var(--m-prim)}
.mkey.sec{background:repeating-linear-gradient(40deg,var(--m-sec-ln) 0 2.5px,var(--m-sec-bg) 2.5px 6px)}
.mchip{padding:3px 8px;border-radius:999px;font-size:12px;font-weight:600}
.mchip.prim{background:color-mix(in srgb,var(--m-prim) 18%,transparent);color:var(--m-prim)}.mchip.sec{background:color-mix(in srgb,var(--m-sec-ln) 16%,transparent);color:var(--m-sec-ln)}
.cues{counter-reset:c;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
.cues li{counter-increment:c;display:flex;gap:10px;font-size:14px;line-height:1.45}
.cues li::before{content:counter(c);flex:0 0 22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-size:11.5px;font-weight:700;display:grid;place-items:center}
.mist{display:flex;flex-direction:column;gap:8px}
.mist>div{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:11px 12px;font-size:13.5px}
.mist .bad{color:var(--bad);font-weight:650;display:flex;gap:7px}.mist .fix{color:var(--good);margin-top:4px;display:flex;gap:7px}
/* ---------- fuel ---------- */
.macro4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macro4>div{background:var(--raised);border-radius:13px;padding:10px 8px;text-align:center}.macro4 b{display:block;font-family:var(--disp);font-size:19px}.macro4 span{font-size:11px;color:var(--muted)}
.mbar{display:flex;height:7px;border-radius:5px;overflow:hidden;margin-top:10px;background:var(--raised2)}.mbar i{display:block}
.mbar .p{background:#60A5FA}.mbar .c{background:var(--good)}.mbar .f{background:var(--gold)}
.items{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.items li{display:flex;gap:9px;font-size:14px;line-height:1.4}.items li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:7px;flex:0 0 auto}
.rcpgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcp{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.rcp .em{font-size:26px}.rcp .n{font-weight:650;font-size:14px;line-height:1.25}.rcp .k{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
/* ---------- accordion ---------- */
.acc{background:var(--surface);border:1px solid var(--hair);border-radius:16px;overflow:hidden}.acc+.acc{margin-top:8px}
.acc>button{width:100%;display:flex;align-items:center;gap:10px;padding:14px;text-align:left;font-weight:650;font-size:15px}
.acc>button .chev{margin-left:auto;transition:transform .25s;color:var(--faint);width:16px;height:16px}
.acc.open>button .chev{transform:rotate(90deg)}
.acc .acc-b{display:none;padding:0 14px 14px}.acc.open .acc-b{display:block;animation:viewIn .25s}
/* ---------- strength coach ---------- */
.exitem{background:var(--surface);border:1px solid var(--hair);border-radius:16px;overflow:hidden}
.exitem .exrow{border:0;border-radius:0;background:transparent}
.setplan{border-top:1px dashed var(--hair2);padding:8px 12px 10px 14px;font-size:12.5px}
.sp-head,.sp-row{display:grid;grid-template-columns:18px minmax(0,1.5fr) 44px minmax(0,1fr) 40px;gap:8px;align-items:center}
.sp-head{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding-bottom:3px}
.sp-head span:nth-child(3),.sp-head span:nth-child(5),.sp-row .sp-p,.sp-row .sp-r{text-align:right}
.sp-row{padding:3px 0}.sp-n{font-family:var(--mono);color:var(--faint);font-size:11px}
.sp-w{font-family:var(--disp);font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-p{font-family:var(--mono);color:var(--text);font-size:12px}.sp-d{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sp-r{font-family:var(--mono);color:var(--faint);font-size:11.5px}
.sp-coach{margin-top:7px;font-weight:650;font-size:12.5px;color:var(--muted);background:var(--raised);border-radius:9px;padding:6px 9px}
.sp-coach.up{color:var(--good);background:var(--good-soft)}.sp-coach.down{color:var(--warn);background:color-mix(in srgb,var(--warn) 11%,transparent)}.sp-coach.reps{color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.sp-empty{color:var(--muted);font-size:12.5px;line-height:1.45}.sp-empty .lnk{color:var(--accent);font-weight:650;text-decoration:underline}
.prep{padding:14px}.prep-h{display:flex;align-items:center;gap:12px}.prep-h .t{font-weight:650;font-size:15px;margin-top:2px}
.prep.after .ico svg{color:var(--good)}.prep.after.done{border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.prep-meta{display:flex;gap:6px}.prep.after .chip.on{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 45%,transparent);color:var(--good)}
.step{display:flex;gap:11px;margin-top:14px}.step>.sn{flex:0 0 24px;height:24px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-weight:700;font-size:12px;display:grid;place-items:center}
.prep.after .step>.sn{background:var(--good-soft);color:var(--good)}
.step b{font-size:14px}
.dose{margin-top:6px;display:flex;flex-direction:column}
.dose>div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
.dose>div:last-child{border-bottom:0}.dn{min-width:0}.dc{display:block;font-size:12px;color:var(--faint);margin-top:1px}.dd{font-family:var(--mono);font-size:12px;color:var(--text);white-space:nowrap;text-align:right}
.ramp{margin-top:9px;background:var(--raised);border-radius:11px;padding:9px 10px}.ramp .rn{font-weight:650;font-size:13px}
.ramp .rs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:5px;font-family:var(--mono);font-size:12px}
.ramp .rs span{background:var(--surface);border:1px solid var(--hair);border-radius:7px;padding:2px 6px}.ramp .rs i{color:var(--faint);font-style:normal}
.ramp .rs .rw{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:700}.ramp .rs .rt{font-family:var(--body);font-size:12.5px;color:var(--muted);background:none;border:0;padding:0}
.mealh{display:flex;flex-direction:column;gap:3px;margin-top:12px}.mealh b{font-family:var(--disp);font-size:17px}.mealt{font-size:12.5px;color:var(--accent);font-weight:600}
.altm{padding:10px 0;border-bottom:1px solid var(--hair)}.altm:last-child{border-bottom:0}
.coachcard{background:var(--surface);border:1px solid var(--hair);border-left:3px solid var(--faint);border-radius:14px;padding:11px 13px;margin-top:8px}
.coachcard b{display:block;font-size:14.5px;margin-top:3px}.coachcard .note{margin-top:3px;line-height:1.45}
.coachcard.up{border-left-color:var(--good)}.coachcard.up b{color:var(--good)}.coachcard.down{border-left-color:var(--warn)}.coachcard.reps{border-left-color:var(--blue)}.coachcard.start,.coachcard.test{border-left-color:var(--accent)}
.mxlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}.mxday{margin-top:12px}
.mxcard{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:13px;transition:border-color .4s}.mxcard.flash{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mxh{display:flex;align-items:center;gap:12px}.mxh .t{font-weight:650;font-size:15px}.mxh .s{font-size:12px;color:var(--muted);margin-top:1px}
.mxv{text-align:right}.mxv b{display:block;font-family:var(--disp);font-size:24px;line-height:1}.mxv b.dim{color:var(--faint)}.mxv span{font-size:10.5px;color:var(--muted)}
.mxseg{margin-top:11px}.mxseg button{height:32px;font-size:12.5px}
.mxin{display:flex;align-items:flex-end;gap:8px;margin-top:10px}.mxf{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}.mxf span{font-size:11.5px;color:var(--muted)}.mxf .nin{width:100%}
.mxx{padding-bottom:11px;color:var(--faint)}
.mxmeta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:9px;font-size:12px;color:var(--muted)}.mxmeta b{color:var(--text)}
.mxproj{display:flex;align-items:center;gap:6px;width:100%;margin-top:10px;background:var(--raised);border:1px solid var(--hair);border-radius:11px;padding:8px 10px;text-align:left}
.mxproj span{flex:1;font-family:var(--disp);font-weight:700;font-size:13.5px;white-space:nowrap}.mxproj i{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:400}
.mxproj .chev{width:16px;height:16px;color:var(--faint);flex:0 0 auto}
.bignum{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.1}

.pj .pjband{fill:var(--accent);fill-opacity:.16;stroke:none}
.pj .pjmid{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4;stroke-linecap:round}
.pj .pjact{fill:none;stroke:var(--text);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.pj .pjdot{fill:var(--text);stroke:var(--surface);stroke-width:2}
.pj .pjm{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.pj .pjl{fill:var(--text);font-family:var(--disp);font-weight:700;font-size:11px}
.pj .nowl{stroke:var(--hair2);stroke-width:1;stroke-dasharray:2 3}
.pj .pjhit{fill:transparent;cursor:pointer}
.pjlegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:12px;color:var(--muted)}
.pjlegend i{display:inline-block;width:16px;height:8px;border-radius:3px;margin-right:6px;vertical-align:0}
.pjlegend .la{height:3px;background:var(--text);vertical-align:2px}.pjlegend .lm{height:0;border-top:2px dashed var(--accent);vertical-align:3px}.pjlegend .lb{background:var(--accent);opacity:.3}
.pjtip{margin-top:8px;min-height:18px}.pjtip b{color:var(--text)}
.pjtab{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.pjtab th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:500;text-align:right;padding:6px 4px}
.pjtab td{text-align:right;padding:7px 4px;border-top:1px solid var(--hair);font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.pjtab th:first-child,.pjtab td:first-child{text-align:left;font-family:var(--body);white-space:normal}
.pjtab.wide tr[data-act]{cursor:pointer}.pjtab.wide td:first-child{font-size:13px;font-weight:600}
/* ---------- simplified layout ---------- */
.gearbtn{width:40px;height:40px;border-radius:12px}.gearbtn svg{width:20px;height:20px}.gearbtn.on{color:var(--accent);border-color:var(--accent-line)}
.tiles.two{grid-template-columns:1fr 1fr}
.ibtn.sm{width:34px;height:34px;border-radius:10px}.ibtn.sm svg{width:16px;height:16px}
.dayhead h2{font-family:var(--disp);font-size:24px;margin:2px 0 2px;letter-spacing:-.01em}
.pgrp{margin:0 0 8px}
.pacc>button{padding:12px 14px}.pacc>button .ico{width:36px;height:36px;border-radius:11px;flex:0 0 auto}
.pacc>button .grow{display:flex;flex-direction:column;min-width:0}.pacc>button b{font-size:14.5px}
.pacc>button small{font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pacc.after>button .ico svg{color:var(--good)}.emo{font-size:18px;line-height:1}
.mline{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12.5px;color:var(--muted)}.mline b{color:var(--text)}
.alts{margin-top:8px}.altm{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--hair);font-size:13.5px}
.altm[data-act]{cursor:pointer}
.snack .items{margin-top:6px}
.pcards{display:flex;flex-direction:column;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--hair);border-radius:18px;padding:14px;cursor:pointer}
.pch{display:flex;align-items:center;gap:10px}.pch .t{font-weight:650;font-size:16px}.pch .s{font-size:12px;color:var(--muted);margin-top:1px}.pch .chev{width:16px;height:16px;color:var(--faint)}
.pcstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.pcstats.one{grid-template-columns:1fr 1fr}
.pcstats>div{background:var(--raised);border-radius:11px;padding:8px 9px;min-width:0}
.pcstats span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.pcstats b{display:block;font-family:var(--disp);font-size:16px;margin-top:2px;white-space:nowrap}
.gup{color:var(--good)}.gdn{color:var(--warn)}
.mcwrap{margin-top:10px}.mc{width:100%;height:auto;display:block;overflow:visible}
.mc .base{stroke:var(--hair2);stroke-width:1}.mc .nextl{stroke:var(--hair2);stroke-width:1;stroke-dasharray:3 4}
.mc text{fill:var(--faint);font-family:var(--mono);font-size:10px}.mc text.nx{fill:var(--muted)}
.mc .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.mc .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}.mc .dot.last{fill:var(--accent)}
.mc .vl{fill:var(--text);font-family:var(--disp);font-weight:700;font-size:12px}.mc .hit{fill:transparent;cursor:pointer}
.mctip{min-height:16px;font-size:12px}
.ckstat .ckrow{display:flex;align-items:baseline;gap:10px;margin-top:4px}.ckstat .ckrow b{font-family:var(--disp);font-size:24px}.ckstat .ckrow span{color:var(--muted);font-size:13.5px}
.cklist{display:flex;flex-direction:column;gap:8px}
.ckr{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:11px 12px}
.ckn b{display:block;font-size:14.5px}.ckn small{font-size:12px;color:var(--muted)}
.ckin{display:flex;align-items:center;gap:8px;margin-top:8px}.ckin .nin{flex:1;min-width:0;width:auto}.ckin>span{color:var(--faint)}
.ckres{flex:0 0 74px;text-align:right;font-style:normal;font-family:var(--disp);font-weight:700;font-size:14px;color:var(--accent)}
/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%) translateY(30px);opacity:0;z-index:90;background:var(--text);color:var(--bg);border-radius:14px;padding:11px 12px 11px 15px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);transition:transform .32s cubic-bezier(.2,.8,.25,1),opacity .25s;max-width:calc(100% - 28px);overflow:hidden;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.toast .undo{color:var(--accent);font-weight:800;padding:4px 8px;border-radius:8px}
.toast .tbar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:100%}
/* ---------- delete / swipe ---------- */
.swipe{position:relative;overflow:hidden;border-radius:16px}
.swipe .sw-bg{position:absolute;inset:0;background:var(--bad);display:flex;align-items:center;justify-content:flex-end;padding-right:22px;color:#fff;border-radius:16px}
.swipe .sw-bg svg{width:22px;height:22px;transition:transform .2s}
.swipe .sw-fg{position:relative;touch-action:pan-y;transition:transform .25s cubic-bezier(.2,.8,.25,1)}
.swipe.armed .sw-bg svg{transform:scale(1.25) rotate(-8deg)}
.trash{color:var(--faint);transition:color .15s}.trash:hover,.trash:active{color:var(--bad)}
.trash svg .lid{transform-origin:16px 6px;transition:transform .2s}.trash:hover svg .lid,.trash:active svg .lid{transform:rotate(-14deg) translateY(-1px)}
.enter{animation:enterRow .34s cubic-bezier(.2,.8,.25,1)}
@keyframes enterRow{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ---------- desktop ---------- */
@media (min-width:900px){
  main .wrap,header.top .wrap{max-width:640px}
  .page-b>.wrap{max-width:640px}
  .rcpgrid{grid-template-columns:repeat(3,1fr)}
}

/* alternatives: same primary muscle group, available at the YMCA */
function exAlternatives(id){
  const e=getEx(id);if(!e)return[];
  const scored=allExercises().filter(x=>x.id!==id).map(x=>{
    let s=0;x.primary.forEach(m=>{if(e.primary.includes(m))s+=3;if(e.secondary.includes(m))s+=1;});
    if(x.group===e.group)s+=1;return {x,s};
  }).filter(o=>o.s>=3).sort((a,b)=>b.s-a.s);
  return scored.slice(0,4).map(o=>o.x);
}

/* =========================================================
   ENGINE — storage, state, schedules, weight recommendations,
   progressive overload, PRs, XP/ranks/badges, streaks, nutrition math
   ========================================================= */
const STORE_KEY='trench2-state';
const Store={
  mem:{},
  get(k){try{const v=localStorage.getItem(k);if(v!=null)return v;}catch(e){}return this.mem[k]??null;},
  set(k,v){this.mem[k]=v;try{localStorage.setItem(k,v);}catch(e){}try{if(window.storage&&window.storage.set)window.storage.set(k,v);}catch(e){}},
  del(k){delete this.mem[k];try{localStorage.removeItem(k);}catch(e){}}
};
const jparse=s=>{try{return JSON.parse(s);}catch(e){return null;}};

/* ---------- dates ---------- */
function ymd(d){d=d||new Date();const m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}
function parseYmd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x;}
function dowIdx(d){return d.getDay();} /* Sun=0 .. Sat=6 — the week starts Sunday */
function weekStart(d){return addDays(d,-dowIdx(d));}
function daysBetween(a,b){return Math.round((parseYmd(ymd(b))-parseYmd(ymd(a)))/864e5);}
let NOW=()=>new Date(); /* overridable in tests */

/* ---------- state ---------- */
function defaultState(){
  return {v:2,
    profile:{name:'',goal:'muscle',exp:'intermediate',heightFt:null,heightIn:null,weightLb:null,age:null,sex:'',activity:'moderate',
      daysPerWeek:5,sessionLen:75,style:'athletic',lastMuscle:'',notif:{rest:true,reminders:true},theme:'dark',nutrition:'maintain',
      restSound:true,equipment:null},
    maxLog:{},            /* {exId:[{date,e,src:'entered'|'workout',w,r}]} — every max ever recorded */
    strength:{},          /* user-entered numbers: {exId:{w,r,date}} */
    exState:{},           /* engine memory per exercise */
    activeProgram:'ppl',
    legendsStart:null,    /* week start (ymd) of Legend's week 1 */
    overrides:{},         /* {progId:{dayId:{slotIdx:{sets,lo,hi,rest,exId}}}} */
    variantPick:{},       /* {progId:dayId:idx : exId} */
    customExercises:[],templates:[],customRecipes:[],
    sessions:[],active:null,bodyLog:[],
    xp:0,badges:{},
  };
}
let S=defaultState();
function loadState(){
  const raw=jparse(Store.get(STORE_KEY));
  if(raw&&raw.v===2){S=Object.assign(defaultState(),raw);S.profile=Object.assign(defaultState().profile,raw.profile||{});}
  else{S=defaultState();migrateOld();}
  return S;
}
function saveState(){Store.set(STORE_KEY,JSON.stringify(S));}
function migrateOld(){
  /* carry over maxes + bodyweight from the previous TRENCH version */
  const prs=jparse(Store.get('trench-prs'));
  if(prs&&typeof prs==='object'){Object.keys(prs).forEach(id=>{const p=prs[id];if(EX[id]&&p&&Number(p.weight)>0)S.strength[id]={w:Number(p.weight),r:Number(p.reps)||1,date:p.date||ymd()};});}
  const bw=jparse(Store.get('trench-bw'));if(bw&&Number(bw)>0)S.profile.weightLb=Number(bw);
}

/* ---------- exercise lookup (built-in + custom) ---------- */
function getEx(id){return EX[id]||S.customExercises.find(c=>c.id===id)||null;}
function allExercises(){return Object.values(EX).concat(S.customExercises);}

/* ---------- program / slot normalization ---------- */
function getProgram(id){return PROGRAMS.find(p=>p.id===id)||PROGRAMS[0];}
function activeProgram(){return getProgram(S.activeProgram);}
function parseRepsText(t){
  t=String(t||'').trim();
  let m=t.match(/^(\d+)\s*[–-]\s*(\d+)/);if(m)return {lo:+m[1],hi:+m[2]};
  m=t.match(/^(\d+)\s*sec/i);if(m)return {time:+m[1]};
  if(/^max/i.test(t))return {max:true};
  m=t.match(/^(\d+)/);if(m)return {lo:+m[1],hi:+m[1]};
  return null;
}
function slotKey(progId,dayId,idx){return progId+':'+dayId+':'+idx;}
function normSlot(raw,progId,dayId,idx){
  let sets,rep;
  if(raw.t){ /* Legend's format "5 × 12–15" */
    const m=raw.t.match(/^(\d+)\s*×\s*(.+)$/);sets=m?+m[1]:3;rep=parseRepsText(m?m[2]:'');
  }else{
    sets=raw.sets||parseInt(raw.setsText,10)||3;rep=parseRepsText(raw.repsText);
    if(!rep&&raw.suggest)rep={lo:raw.suggest[0],hi:raw.suggest[1],suggested:true};
  }
  rep=rep||{lo:8,hi:12};
  const ov=(((S.overrides[progId]||{})[dayId]||{})[idx])||{};
  const vk=slotKey(progId,dayId,idx);
  let exId=ov.exId||S.variantPick[vk]||raw.defaultVariant||raw.id;
  if(raw.variants&&!ov.exId&&!raw.variants.includes(exId))exId=raw.defaultVariant||raw.variants[0];
  const s={raw,progId,dayId,idx,exId,baseId:raw.id,name:raw.n,
    setsText:raw.t?raw.t.split('×')[0].trim():raw.setsText,repsText:raw.t?raw.t.split('×').slice(1).join('×').trim():raw.repsText,
    sets,lo:rep.lo??null,hi:rep.hi??null,time:rep.time||null,max:!!rep.max,suggested:!!rep.suggested,
    perSide:/each arm/i.test(raw.repsText||'')||!!(getEx(exId)||{}).perSide,
    rest:raw.rest||90,ss:raw.ss||null,note:raw.note||'',variants:raw.variants||null,edited:false};
  if(ov.sets){s.sets=ov.sets;s.edited=true;}
  if(ov.lo){s.lo=ov.lo;s.hi=ov.hi||ov.lo;s.time=null;s.max=false;s.edited=true;}
  if(ov.time){s.time=ov.time;s.lo=s.hi=null;s.edited=true;}
  if(ov.rest){s.rest=ov.rest;s.edited=true;}
  if(ov.exId){s.edited=true;s.swapped=true;}
  return s;
}
function daySlots(progId,dayId){
  const p=getProgram(progId);const d=p.days.find(x=>x.id===dayId);if(!d||d.rest)return[];
  return d.ex.map((raw,i)=>normSlot(raw,progId,dayId,i));
}
function getDay(progId,dayId){return getProgram(progId).days.find(d=>d.id===dayId)||null;}

/* ---------- schedule ---------- */
const REST_DAY={id:'rest',name:'Rest',rest:true,type:'rest',ex:[]};
function legendsWeekIdx(date){
  if(!S.legendsStart)S.legendsStart=ymd(weekStart(NOW()));
  const w=Math.floor(daysBetween(weekStart(parseYmd(S.legendsStart)),weekStart(date))/7);
  return ((w%2)+2)%2;
}
function dayForDate(progId,date){
  const p=getProgram(progId);date=date||NOW();const di=dowIdx(date);
  if(p.id==='ppl')return p.days.find(d=>d.id===p.schedule[di]);
  const code=p.schedule2wk[legendsWeekIdx(date)][di];
  if(code==='rest')return REST_DAY;
  return p.days.find(d=>d.id===code);
}
function weekPlan(progId,anchor){
  const mon=weekStart(anchor||NOW());
  return DOW.map((lab,i)=>{const dt=addDays(mon,i);return {date:dt,ymd:ymd(dt),dow:lab,day:dayForDate(progId,dt)};});
}
function sessionOn(dateStr){return S.sessions.filter(s=>s.date===dateStr);}

/* ---------- strength math (never rounds a max UP) ---------- */
const e1rm=(w,r)=>w>0&&r>0?(r<=1?w:w*(1+r/30)):0;   /* Epley; a single is the max itself */
/* power cleans: technique-limited, so working weights come from a %-of-max table, not the rep formula */
const POWER_PCT=[0,.85,.82,.78,.75,.72,.68,.65,.62];
function powerPct(r){return POWER_PCT[Math.min(8,Math.max(1,Math.round(r)||1))];}
/* conservative max estimate from ONE logged set (only counts reps in reserve the lifter reported) */
function setMaxEstimate(ex,s){
  if(!ex||!s||!s.done||!(s.r>0)||ex.kind==='time')return 0;
  const load=loadOf(ex,s.w);if(!(load>0))return 0;
  if(ex.kind==='power'){const adj=s.effort==='broke'?.08:s.effort==='slow'?.05:0;return load/Math.min(.95,powerPct(s.r)+adj);}
  /* 'solid' = the planned reps in reserve for that set (same assumption the weight calculator uses) */
  const planned=s.rec&&s.rec.rir!=null?s.rec.rir:1;
  const rir=s.effort==='max'?0:s.effort==='easy'?Math.max(2,planned+1):s.effort==='solid'?planned:0;
  return e1rm(load,Math.min(15,s.r+rir));
}
const floorTo=(x,inc)=>Math.floor(x/inc+1e-9)*inc;
function plannedRIR(kind,k,n){
  if(kind==='power')return 4;
  if(kind==='isolation')return k===n-1?0:1;
  if(n<=1)return 1.5;
  return 2-(k/(n-1));               /* compounds: 2 RIR on set 1 → 1 RIR on the last set */
}
function fatigueFactor(kind,k){
  if(kind==='power')return 1;
  if(kind==='isolation')return Math.max(.85,1-.05*k);
  return Math.max(.88,1-.03*k);
}
function effortRIR(effort,planned,kind){
  if(kind==='power')return effort==='broke'?1:effort==='slow'?2:4;
  if(effort==='easy')return 3;if(effort==='max')return 0;return planned;
}
function bodyweight(){return Number(S.profile.weightLb)||0;}
function loadOf(ex,w){return ex.kind==='bw'?bodyweight()+(Number(w)||0):Number(w)||0;}
function clampWeight(ex,w){
  if(ex.kind==='bw'){const bw=bodyweight();if(!bw)return 0;let add=floorTo(w-bw,ex.inc||5);return Math.max(add,-Math.max(0,bw-40));}
  let x=floorTo(w,ex.inc||5);
  if(ex.equip==='barbell')x=Math.max(45,x);
  if(ex.equip==='dumbbell')x=Math.min(100,Math.max(5,x));

}
function schemeKey(slot){return slot.time?'t'+slot.time:slot.max?'max':(slot.lo+'-'+slot.hi);}
function exMem(id){return S.exState[id]||(S.exState[id]={e1rm:0,schemes:{},stall:0,history:[]});}
/* best available 1RM estimate for an exercise (total load for bodyweight moves) */
function knownE1RM(id){
  const m=S.exState[id];if(m&&m.e1rm>0)return m.e1rm;
  const s=S.strength[id];const ex=getEx(id);
  if(s&&s.r>0&&ex&&(Number(s.w)>0||(ex.kind==='bw'&&bodyweight()>0)))return e1rm(loadOf(ex,Number(s.w)||0),s.r);
  return 0;
}
function targetReps(slot){
  if(slot.time||slot.max)return null;
  if(slot.lo===slot.hi)return slot.lo;
  const sc=(exMem(slot.exId).schemes||{})[schemeKey(slot)];
  return Math.min(slot.hi,Math.max(slot.lo,(sc&&sc.repTarget)||slot.lo));
}
/* planned recommendation for every set of a slot (before the session starts) */
function planSets(slot){
  const ex=getEx(slot.exId);const n=slot.sets;const out=[];
  if(!ex)return out;
  if(slot.time){const sc=exMem(slot.exId).schemes[schemeKey(slot)];const t=(sc&&sc.nextTime)||slot.time;for(let k=0;k<n;k++)out.push({k,reps:null,time:t,w:null,mode:'time'});return out;}
  if(slot.max){for(let k=0;k<n;k++)out.push({k,reps:null,max:true,w:ex.kind==='bw'?0:null,mode:'max'});return out;}
  const T=targetReps(slot);const E=knownE1RM(slot.exId);
  if(ex.kind==='bw'&&!bodyweight()){for(let k=0;k<n;k++)out.push({k,reps:T,w:0,mode:'bw-noweight',rir:plannedRIR(ex.kind,k,n)});return out;}
  if(!E){for(let k=0;k<n;k++)out.push({k,reps:T,w:null,mode:k===0?'calibrate':'pending',rir:plannedRIR(ex.kind,k,n)});return out;}
  const base=[];for(let k=0;k<n;k++){const rir=plannedRIR(ex.kind,k,n);base.push(ex.kind==='power'?E*powerPct(T):E/(1+(T+rir)/30)*fatigueFactor(ex.kind,k));}
  /* progression guard (progressive overload memory) */
  const sc=exMem(slot.exId).schemes[schemeKey(slot)];
  let w0=base[0],why='From your numbers';
  if(sc&&sc.lastW!=null){
    const last=loadOf(ex,sc.lastW);const inc=ex.progInc||ex.inc||5;
    if(sc.result==='up'){w0=Math.min(Math.max(base[0],last+inc),last*1.15+inc);why='Progress: +'+inc+' lb';}
    else if(sc.result==='repeat'){w0=last;why='Repeat — own this weight';}
    else if(sc.result==='hold'){w0=Math.min(base[0],last);why='Hold — build reps back up';}
    else if(sc.result==='deload'){w0=last*.9;why='Reset −10% to break the plateau';}
  }
  /* coming back after 2+ weeks off this lift: start 10% lighter (never chase the old number) */
  const lastH=(exMem(slot.exId).history||[]).slice(-1)[0];let layoff=false;
  if(lastH&&daysBetween(parseYmd(lastH.date),NOW())>14){layoff=true;const ref=sc&&sc.lastW!=null?Math.min(w0,loadOf(ex,sc.lastW)):w0;w0=ref*.9;why='Back after a break — 10% lighter';}
  const ratio=w0/base[0];
  for(let k=0;k<n;k++){out.push({k,reps:T,w:clampWeight(ex,base[k]*ratio),rir:plannedRIR(ex.kind,k,n),mode:'rec',why:k===0?why:'',layoff});}
  /* never let a later set recommend more than set 1 */
  for(let k=1;k<n;k++)if(out[k].w>out[0].w)out[k].w=out[0].w;
  return out;
}
/* live adjustment after a completed set: returns recommended weight for set k+1 */
function adjustNext(slot,setsLog,k){
  const ex=getEx(slot.exId);const done=setsLog[k];if(!ex||!done||!done.done)return null;
  if(slot.time||slot.max)return null;
  const n=slot.sets;if(k+1>=n)return null;
  const T=targetReps(slot);
  const rirNow=effortRIR(done.effort||'solid',plannedRIR(ex.kind,k,n),ex.kind);
  const loadNow=loadOf(ex,done.w);if(!(loadNow>0)||!(done.r>0))return null;
  const eSet=e1rm(loadNow,done.r+rirNow);
  let next=eSet/(1+(T+plannedRIR(ex.kind,k+1,n))/30)*(fatigueFactor(ex.kind,k+1)/fatigueFactor(ex.kind,k));
  next=Math.min(next,loadNow*1.10);next=Math.max(next,loadNow*.80);
  if(ex.kind==='power'){
    if(done.effort==='broke')next=loadNow*.9;
    else if(done.effort==='slow')next=Math.min(next,loadNow*.95);
    else next=Math.min(next,loadNow); /* cleans never climb within a session */
  }
  if(ex.kind==='bw'&&!bodyweight())return 0;
  return clampWeight(ex,next);
}
/* evaluate one exercise after a session → progressive overload decision */
function evaluateSlot(slot,setsLog){
  const ex=getEx(slot.exId);const done=setsLog.filter(s=>s.done&&s.r>0);
  if(!ex||!done.length)return null;
  const mem=exMem(slot.exId);const key=schemeKey(slot);const sc=mem.schemes[key]||(mem.schemes[key]={});
  if(slot.time){const best=Math.max(...done.map(s=>s.r));sc.nextTime=best>=slot.time?best+5:slot.time;sc.result=best>=slot.time?'up':'repeat';return sc.result;}
  /* session e1RM from the best set, using effort-adjusted reps in reserve */
  let best=0;done.forEach((s,i)=>{const rir=effortRIR(s.effort||'solid',plannedRIR(ex.kind,i,slot.sets),ex.kind);const v=ex.kind==='power'?setMaxEstimate(ex,Object.assign({},s,{effort:s.effort||'fast'})):e1rm(loadOf(ex,s.w),s.r+rir);if(v>best)best=v;});
  sc.lastReps=done.map(s=>s.r);sc.partial=done.length<slot.sets;
  if(slot.max){if(best>0)mem.e1rm=best;sc.result=done.length>=slot.sets?'up':'repeat';sc.lastW=done[0].w;sc.bestReps=Math.max(...done.map(s=>s.r));return sc.result;}
  const T=targetReps(slot);const reps=done.map(s=>s.r);const short=reps.map(r=>Math.max(0,(slot.lo===slot.hi?T:slot.lo)-r));
  const allSets=done.length>=slot.sets;let result;
  if(slot.lo!==slot.hi){ /* double progression */
    if(allSets&&reps.every(r=>r>=slot.hi)){result='up';sc.repTarget=slot.lo;}
    else if(short.some(x=>x>=2)){result='hold';sc.repTarget=slot.lo;}
    else{result='repeat';sc.repTarget=Math.min(slot.hi,Math.min(...reps)+1);}
  }else if(ex.kind==='power'){
    if(done.some(s=>s.effort==='broke'))result='hold';
    else if(allSets&&done.every(s=>s.effort!=='slow')&&short.every(x=>x===0))result='up';
    else result='repeat';
  }else{
    const missed=short.filter(x=>x>0);
    const grinded=ex.kind!=='isolation'&&done[done.length-1].effort==='max';
    if(!allSets&&missed.length===0)result='repeat'; /* skipped sets: keep the weight, no stall */
    else if(allSets&&missed.length===0&&!grinded)result='up';
    else if(allSets&&missed.length===0&&grinded)result='repeat';
    else if(missed.length===1&&missed[0]===1)result='repeat';
    else result='hold';
    if(allSets&&reps[0]>=T+3&&result!=='hold')result='up';
  }
  /* light weights: a fixed jump can be 15–25% (5 lb on a 25-lb dumbbell) — earn it with extra reps first */
  sc.needReps=null;
  if(result==='up'&&slot.lo===slot.hi&&ex.kind!=='power'&&ex.kind!=='bw'){
    const incPct=(ex.progInc||ex.inc||5)/Math.max(1,loadOf(ex,done[0].w));
    if(incPct>.08){const need=ex.kind==='isolation'?T+2:T+1;const ok=ex.kind==='isolation'?reps[reps.length-1]>=need:reps.every(r=>r>=need);if(!ok){result='repeat';sc.needReps=need;}}
  }
  if(result==='hold'){mem.stall=(mem.stall||0)+1;if(mem.stall>=2){result='deload';mem.stall=0;}}
  else if(result==='up')mem.stall=0;
  sc.result=result;sc.lastW=done[0].w;sc.date=ymd(NOW());
  /* working e1RM moves toward what you actually did (capped so one great day can't spike it) */
  const prev=mem.e1rm||knownE1RM(slot.exId)||best;
  mem.e1rm=best>prev?Math.min(best,prev*1.15):(result==='deload'?best:Math.max(best,prev*.95));
  return result;
}

/* ---------- formatting ---------- */
function fmtW(ex,w,opts){
  opts=opts||{};if(!ex)return '';
  if(ex.kind==='time')return '';
  if(w==null)return '—';
  if(ex.kind==='bw'){if(!bodyweight()&&!w)return 'Bodyweight';const a=Number(w)||0;if(Math.abs(a)<5)return 'Bodyweight';return a>0?'+'+a+' lb':'Assist '+(-a)+' lb';}
  return w+' lb'+(ex.perHand&&!opts.short?' each':'');
}
function statusChip(result){return {up:['↑','Add weight'],repeat:['=','Repeat'],hold:['•','Hold'],deload:['↓','Reset −10%']}[result]||null;}

/* ---------- sessions, volume, PRs ---------- */
function setVolume(ex,s){if(!ex||!s.done||ex.kind==='time')return 0;const mult=(ex.perHand||ex.perSide)?2:1;return loadOf(ex,s.w)*(s.r||0)*mult;}
function exBests(id,excludeSessionId){
  let bestE=0,bestW=0;const ex=getEx(id);
  S.sessions.forEach(ss=>{if(ss.id===excludeSessionId)return;ss.items.forEach(it=>{if(it.exId!==id)return;it.sets.forEach(s=>{if(!s.done||!(s.r>0))return;const l=loadOf(ex,s.w);bestE=Math.max(bestE,setMaxEstimate(ex,s));bestW=Math.max(bestW,l);});});});
  return {e:Math.floor(bestE),w:bestW};
}
function finalizeSession(sess){
  let vol=0,sets=0,prs=[];const results={};
  sess.items.forEach(it=>{
    const ex=getEx(it.exId);it.sets.forEach(s=>{if(s.done){sets++;vol+=setVolume(ex,s);}});
    const before=exBests(it.exId,sess.id);
    let sessE=0,sessW=0;it.sets.forEach(s=>{if(s.done&&s.r>0){const l=loadOf(ex,s.w);sessE=Math.max(sessE,setMaxEstimate(ex,s));sessW=Math.max(sessW,l);}});
    if(ex&&ex.kind!=='time'&&sessE>0&&(before.e>0||before.w>0)){
      if(Math.floor(sessE)>before.e)prs.push({exId:it.exId,type:'e1rm',val:Math.floor(sessE)});
      else if(sessW>before.w)prs.push({exId:it.exId,type:'weight',val:sessW});
    }
    if(it.slot)results[it.exId]=evaluateSlot(it.slot,it.sets);
    const mem=exMem(it.exId);mem.history=(mem.history||[]).concat([{date:sess.date,e:Math.floor(sessE),w:sessW}]).slice(-40);
    if(ex&&ex.kind!=='time'&&sessE>0&&recordWorkoutMax(it.exId,sessE,sess.date))(sess.newMaxes=sess.newMaxes||[]).push({exId:it.exId,e:Math.floor(sessE)});
  });
  sess.volume=Math.round(vol);sess.setCount=sets;sess.prs=prs;sess.results=results;
  return sess;
}

/* ---------- XP, levels, ranks ---------- */
const RANKS=[[1,'Rookie'],[3,'Walk-On'],[6,'Starter'],[9,'Varsity'],[13,'All-Conference'],[17,'All-State'],[22,'All-American'],[28,'Captain'],[35,'Pro'],[45,'Hall of Fame']];
function levelFromXP(xp){let L=1,need=200,acc=0;while(xp>=acc+need){acc+=need;L++;need=200+50*(L-1);}return {level:L,into:xp-acc,need,rank:rankFor(L)};}

function nextRank(L){const n=RANKS.find(([lv])=>lv>L);return n?{level:n[0],name:n[1]}:null;}
function sessionXP(sess,streak){
  let xp=100+4*sess.setCount+40*sess.prs.length+5*Math.min(streak||0,20);
  const planned=sess.items.reduce((a,it)=>a+(it.slot?it.slot.sets:it.sets.length),0);
  if(sess.setCount>=planned&&planned>0)xp+=25;

/* ---------- streak (rest days never break it) ---------- */
function isTrainingDay(date){const d=dayForDate(S.activeProgram,date);return d&&!d.rest;}
function streakInfo(){
  const done=new Set(S.sessions.map(s=>s.date));let streak=0;const today=NOW();
  for(let i=0;i<400;i++){
    const d=addDays(today,-i);const k=ymd(d);
    if(done.has(k)){streak++;continue;}  /* any completed workout counts */
    if(!isTrainingDay(d))continue;

  }
  const best=Math.max(S.bestStreak||0,streak);S.bestStreak=best;

/* ---------- nutrition math (DRI estimated energy requirement equations) ---------- */
const ACTIVITY=[
  {id:'light',label:'Light',desc:'School or desk day, a couple of workouts a week',pa:{boy:1.00,girl:1.00,man:1.00,woman:1.00}},
  {id:'moderate',label:'Moderate',desc:'4–5 lifting sessions a week',pa:{boy:1.13,girl:1.16,man:1.11,woman:1.12}},
  {id:'high',label:'High',desc:'Lifting plus sports practice most days',pa:{boy:1.26,girl:1.31,man:1.25,woman:1.27}},
  {id:'veryhigh',label:'Very high',desc:'Two-a-days or a full-time athlete',pa:{boy:1.42,girl:1.56,man:1.48,woman:1.45}},
];
function bodyMetrics(p){
  p=p||S.profile;const inches=(Number(p.heightFt)||0)*12+(Number(p.heightIn)||0);
  const ok=inches>0&&Number(p.weightLb)>0&&Number(p.age)>0;
  return {ok,inches,m:inches*.0254,kg:(Number(p.weightLb)||0)*.45359237,lb:Number(p.weightLb)||0,age:Number(p.age)||0};
}
function eer(p){
  p=p||S.profile;const b=bodyMetrics(p);if(!b.ok)return null;
  const act=ACTIVITY.find(a=>a.id===p.activity)||ACTIVITY[1];
  const teen=b.age<19;
  const male=()=>teen?88.5-61.9*b.age+act.pa.boy*(26.7*b.kg+903*b.m)+25:662-9.53*b.age+act.pa.man*(15.91*b.kg+539.6*b.m);
  const female=()=>teen?135.3-30.8*b.age+act.pa.girl*(10.0*b.kg+934*b.m)+25:354-6.91*b.age+act.pa.woman*(9.36*b.kg+726*b.m);
  const v=p.sex==='male'?male():p.sex==='female'?female():(male()+female())/2;
  return Math.round(v/10)*10;
}
function nutritionTargets(mode,p){
  p=p||S.profile;const maint=eer(p);if(!maint)return null;const b=bodyMetrics(p);const teen=b.age<18;
  let cal=maint,delta=0;
  if(mode==='cut'){delta=teen?-Math.min(350,Math.round(maint*.10)):-Math.max(300,Math.min(600,Math.round(maint*.20)));}
  else if(mode==='bulk'){delta=Math.max(250,Math.min(teen?400:400,Math.round(maint*.10)));}
  cal=Math.round((maint+delta)/10)*10;
  const pPerLb=mode==='cut'?0.9:0.8;
  const protein=Math.round(Math.min(b.lb*pPerLb,b.lb>0?b.lb*pPerLb:0));
  const fat=Math.round(Math.max(cal*.25/9,b.lb*.3));
  const carbs=Math.max(0,Math.round((cal-protein*4-fat*9)/4));
  return {maint,cal,delta,protein,fat,carbs,teen,mode};
}

/* =========================================================
   STRENGTH COACH
   maxes · set-by-set prescription · ramp-up sets · plain-language
   overload advice · personalized strength projections.
   Rules: maxes and projections are always rounded DOWN; projections
   are estimates for motivation and never drive the training weights —
   recommendations come only from what was actually lifted.
   ========================================================= */

/* ---------- maxes (one source of truth, with history) ---------- */
function maxLogOf(id){S.maxLog=S.maxLog||{};return S.maxLog[id]||(S.maxLog[id]=[]);}
function recordMax(id,e,src,extra){
  e=Math.floor(e);if(!(e>0))return;
  const L=maxLogOf(id);const date=(extra&&extra.date)||ymd(NOW());
  const last=L[L.length-1];
  if(last&&last.date===date&&last.src===src&&src==='workout'){Object.assign(last,extra||{},{e});return;}
  if(last&&last.date===date&&last.src===src&&last.e===e&&(!extra||(last.w===extra.w&&last.r===extra.r)))return; /* exact duplicate */
  L.push(Object.assign({date,src},extra||{},{e}));
  if(L.length>80)L.splice(0,L.length-80);
}
function maxInfo(id){
  const L=((S.maxLog||{})[id]||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  if(!L.length)return {cur:0,prev:0,best:0,entries:[]};
  const c=L[L.length-1];let prev=0,prevDate=null;
  for(let i=L.length-2;i>=0;i--){if(L[i].e!==c.e){prev=L[i].e;prevDate=L[i].date;break;}}
  let best=0,bestDate=null;L.forEach(x=>{if(x.e>=best){best=x.e;bestDate=x.date;}});
  return {cur:c.e,curDate:c.date,curSrc:c.src,prev,prevDate,best,bestDate,entries:L};
}
function displayMax(id){return maxInfo(id).cur;}
/* a logged session beats the current max → it becomes the new max */
function recordWorkoutMax(id,e,date){e=Math.floor(e);if(e>maxInfo(id).cur){recordMax(id,e,'workout',{date});return true;}return false;}
/* user enters a max: a true 1RM (reps = 1) or weight × reps → estimated */
function setEnteredMax(id,w,r){
  const ex=getEx(id);if(!ex||ex.kind==='time')return 0;
  w=Number(w)||0;r=Math.min(15,parseInt(r,10)||0);
  if(!(r>0)||!(w>0||ex.kind==='bw'))return 0;
  if(ex.kind==='bw'&&!bodyweight())return -1;
  S.strength[id]={w,r,date:ymd(NOW())};
  const e=e1rm(loadOf(ex,w),r);recordMax(id,e,'entered',{w,r});
  /* the new max takes over: drop the old working estimate and old progression anchor */
  const m=exMem(id);m.e1rm=0;m.stall=0;Object.values(m.schemes||{}).forEach(sc=>{delete sc.lastW;delete sc.result;});
  return Math.floor(e);
}
function clearEnteredMax(id){delete S.strength[id];const L=maxLogOf(id);for(let i=L.length-1;i>=0;i--)if(L[i].src==='entered'&&L[i].date===ymd(NOW()))L.splice(i,1);}
/* migrate older saves: seed the log from entered numbers and logged history */
function seedMaxLog(){
  S.maxLog=S.maxLog||{};
  Object.entries(S.strength||{}).forEach(([id,s])=>{const ex=getEx(id);if(!ex||(S.maxLog[id]&&S.maxLog[id].length))return;
    if(s&&s.r>0&&(Number(s.w)>0||(ex.kind==='bw'&&bodyweight()>0)))recordMax(id,e1rm(loadOf(ex,Number(s.w)||0),s.r),'entered',{date:s.date||ymd(NOW()),w:s.w,r:s.r});});
  Object.entries(S.exState||{}).forEach(([id,m])=>{(m.history||[]).slice().sort((a,b)=>a.date<b.date?-1:1).forEach(h=>{if(h.e>maxInfo(id).cur)recordMax(id,h.e,'workout',{date:h.date});});});
}

/* ---------- set-by-set prescription ---------- */
function setDifficulty(ex,rir,slot){

function postTargets(dayKey,mode){
  const lb=Number(S.profile.weightLb)||0;const legs=dayKey==='d3'||dayKey==='d6';
  if(!lb)return {p:'30–45',c:legs?'70–120':'50–100',personal:false};
  const kg=lb/2.2046;const t=typeof nutritionTargets==='function'?nutritionTargets(mode==='base'?'maintain':mode):null;
  const pr=t?Math.max(25,Math.min(60,Math.round(t.protein/4/5)*5)):Math.max(25,Math.min(50,Math.round(kg*.4/5)*5));
  const cr=(mode==='cut'?.5:mode==='bulk'?1.1:.8)+(legs?.2:0);
  return {p:pr,c:Math.round(kg*cr/5)*5,personal:true};
}

    let best=Math.abs(target-tot().kcal),move=null;
    plan.filter(m=>m.flex&&m.servings>.5).forEach(m=>{ADDONS.filter(a=>a.modes.includes(mode)).forEach(a=>{
      m.servings-=.5;adds.push(a);const d=Math.abs(target-tot().kcal);adds.pop();m.servings+=.5;
      if(d<best){best=d;move={m,a};}});});
    if(move){move.m.servings-=.5;adds.push(move.a);}
  }
  const sum=tot();Object.keys(sum).forEach(k=>sum[k]=Math.round(sum[k]));
  const addGroups={};adds.forEach(a=>{addGroups[a.id]=addGroups[a.id]||{a,n:0};addGroups[a.id].n++;});
  return {plan,adds:Object.values(addGroups),sum};
}

  a1.onfinish=()=>{el.style.overflow='hidden';
    const a2=el.animate([{height:h+'px',marginTop:cs.marginTop,marginBottom:cs.marginBottom,paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom},
      {height:'0px',marginTop:'0px',marginBottom:'0px',paddingTop:'0px',paddingBottom:'0px'}],{duration:240,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});

/* ---------- rest timer ---------- */
let audioCtx=null;
function ensureAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}}
function beep(){if(!S.profile.notif||!S.profile.notif.rest)return;try{ensureAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.25,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.5);o.start();o.stop(audioCtx.currentTime+.55);}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([180,90,180]);}catch(e){}}
function startRest(sec,label){if(!S.active)return;S.active.rest={end:Date.now()+sec*1000,total:sec,label};commit();resumeRestTimer();}
function resumeRestTimer(){
  const bar=$('#restbar');const R=S.active&&S.active.rest;clearInterval(UI.restTick);
  if(!R){bar.classList.remove('show','done');document.body.classList.remove('resting');return;}
  bar.classList.remove('done');
  const draw=()=>{const left=Math.max(0,Math.ceil((R.end-Date.now())/1000));
    if(left<=0){clearInterval(UI.restTick);bar.classList.add('done');bar.innerHTML=`<div class="t">0:00</div><div class="l"><b>Rest Complete</b>Next Set — let’s go</div><button data-act="rest-skip">OK</button>`;beep();S.active.rest=null;commit();setTimeout(()=>{bar.classList.remove('show');document.body.classList.remove('resting');},3500);return;}
    bar.innerHTML=`<div class="t">${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</div><div class="l"><b>Rest</b>${esc(R.label||'')}</div><button data-act="rest-add">+15s</button><button data-act="rest-skip">Skip</button><i class="fill" style="width:${(1-left/R.total)*100}%"></i>`;};
  draw();bar.classList.add('show');document.body.classList.add('resting');UI.restTick=setInterval(draw,500);
}
function stopRestTimer(hide){clearInterval(UI.restTick);if(S.active)S.active.rest=null;if(hide){$('#restbar').classList.remove('show','done');document.body.classList.remove('resting');}}
Object.assign(ACT,{
  'rest-add':()=>{const R=S.active&&S.active.rest;if(!R)return;R.end+=15000;R.total+=15;commit();resumeRestTimer();},
  'rest-skip':()=>{stopRestTimer(true);commit();},
});

/* ---------- charts ---------- */
function barChart(vals,labels,opts){
  opts=opts||{};const W=320,H=150,pl=34,pb=20,pt=10;const max=Math.max(1,...vals);const bw=(W-pl-8)/vals.length;
  const ticks=[0,.5,1].map(f=>Math.round(max*f));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${ticks.map(t=>{const y=H-pb-(t/max)*(H-pb-pt);return `<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl-5}" y="${y+3}" text-anchor="end">${t>=1000?Math.round(t/1000)+'k':t}</text>`;}).join('')}
   ${vals.map((v,i)=>{const h=(v/max)*(H-pb-pt);const x=pl+i*bw+bw*.18;return `<rect class="bar${i===vals.length-1?'':''}${v?'':' dim'}" x="${x}" y="${H-pb-Math.max(h,2)}" width="${bw*.64}" height="${Math.max(h,2)}" rx="4"/><text x="${x+bw*.32}" y="${H-5}" text-anchor="middle">${labels[i]}</text>`;}).join('')}</svg>`;
}
function lineChart(pts,opts){
  opts=opts||{};if(pts.length<2)return `<div class="empty">${pts.length?'One data point so far — log another session to see the trend.':'No data yet.'}</div>`;
  const W=320,H=160,pl=38,pb=22,pt=12,pr=10;const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mx-mn<10){mn-=5;mx+=5;}const pad=(mx-mn)*.12;mn=Math.floor(mn-pad);mx=Math.ceil(mx+pad);
  const X=i=>pl+i*(W-pl-pr)/(pts.length-1),Y=v=>H-pb-(v-mn)/(mx-mn)*(H-pb-pt);
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ');
  const step=Math.ceil(pts.length/5);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="cgrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
   ${[mn,(mn+mx)/2,mx].map(t=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl-5}" y="${Y(t)+3}" text-anchor="end">${Math.round(t)}</text>`).join('')}
   <path class="area" d="${d} L${X(pts.length-1)},${H-pb} L${X(0)},${H-pb} Z"/><path class="ln" d="${d}"/>
   ${pts.map((p,i)=>`<circle class="pt" cx="${X(i)}" cy="${Y(p.y)}" r="3.5"/>${i%step===0||i===pts.length-1?`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${p.x}</text>`:''}`).join('')}</svg>`;
}

function mealKeyFor(progId,day){if(!day||day.rest)return null;if(progId==='ppl')return PRE_SNACK[day.id]?day.id:null;return {quads:'d3',push:'d1',upper:'d5',posterior:'d6',pull:'d2',legs:'d3'}[day.type]||'d1';}

/* ---------- small building blocks ---------- */
function dosesList(rows){return `<div class="dose">${rows.map(([n,d,c])=>`<div><span class="dn">${esc(n)}${c?`<span class="dc">${esc(c)}</span>`:''}</span><span class="dd">${esc(d)}</span></div>`).join('')}</div>`;}
function macroLine(m){return `<div class="mline"><b>${num(m.kcal)} kcal</b><span>${m.p} g protein</span><span>${m.c} g carbs</span><span>${m.f} g fat</span></div>`;}
/* a collapsible row with an icon, title and one-line summary */

function warmupSub(type){const W=WARMUP_PLAN[type]||WARMUP_PLAN.upper;return `${W.dur} · ${W.moves.length} moves`;}

/* ---------- pre-workout snack ---------- */
function snackHTML(key){const sn=PRE_SNACK[key];if(!sn)return '';const mode=mealMode();

function cooldownHTML(type){const C=COOLDOWN[type]||COOLDOWN.upper;const st=STRETCHES[type]||STRETCHES.upper;

function postMealHTML(key){
  const pm=POSTWORKOUT[key];if(!pm)return '';const mode=mealMode();const items=pm[mode];const m=mode==='cut'?pm.mCut:mode==='bulk'?pm.mBulk:pm.mBase;const pt=postTargets(key,mode);

   <div class="alts">${pm.alts.map(a=>{const r=a.recipe?recipeById(a.recipe):null;return `<div class="altm"${r?` data-act="recipe" data-id="${r.id}"`:''}><span>Or: <b>${esc(a.title)}</b></span><span class="note mono">${a.m.kcal} kcal · ${a.m.p} g P${r?' ›':''}</span></div>`;}).join('')}</div>`;
}

/* =========================================================
   PROGRESS — quarterly max check-ins
   1. enter maxes (baseline)  2. saved  3. prompted again after 3 months
   4. compared with the previous check-in  5. charts update.
   Only numbers the user actually entered are charted — nothing is simulated.
   ========================================================= */
const CHECKIN_DAYS=91;
function checkins(){S.checkins=S.checkins||[];return S.checkins;}
/* older saves: every date a max was entered becomes a check-in */
function migrateCheckins(){if(S.checkins&&S.checkins.length)return;const d=new Set();Object.values(S.maxLog||{}).forEach(L=>L.forEach(x=>{if(x.src==='entered')d.add(x.date);}));S.checkins=[...d].sort().map(date=>({date}));}
function checkinStatus(){const c=checkins();if(!c.length)return {state:'none'};const last=c[c.length-1].date;const due=addDays(parseYmd(last),CHECKIN_DAYS);const left=daysBetween(NOW(),due);
  return {state:left<=0?'due':'wait',last,due,left,frac:Math.min(1,Math.max(0,1-left/CHECKIN_DAYS))};}
/* one point per check-in date: what was entered that day */
function seriesFor(id){
  const by={};((S.maxLog||{})[id]||[]).forEach(x=>{if(x.src==='entered')by[x.date]=x;});
  const c=checkins();const base=c.length?c[0].date:Object.keys(by).sort()[0];
  return Object.keys(by).sort().map(d=>({date:d,e:by[d].e,w:by[d].w,r:by[d].r,m:Math.max(0,Math.round(daysBetween(parseYmd(base),parseYmd(d))/30.44))}));
}
function checkinExercises(){
  const p=activeProgram();const ids=[];const add=id=>{const e=getEx(id);if(e&&e.kind!=='time'&&!ids.includes(id))ids.push(id);};
  (p.id==='legends'?['d1','d2','d3','d4','d5','d6','d7']:['d1','d2','d3','d5']).forEach(d=>{const day=getDay(p.id,d);if(day&&!day.rest)daySlots(p.id,d).forEach(s=>add(s.exId));});
  Object.keys(S.maxLog||{}).forEach(id=>{if(seriesFor(id).length)add(id);});
  const main=ids.filter(id=>getEx(id).kind!=='isolation'),acc=ids.filter(id=>getEx(id).kind==='isolation');
  return {main,acc};
}
const pctTxt=(a,b)=>{if(!(b>0))return '';const v=(a-b)/b*100;return (v>=0?'+':'')+(Math.round(v*10)/10)+'%';};
const lbTxt=d=>(d>=0?'+':'')+num(d)+' lb';

/* ---------- one simple chart per exercise ---------- */
function maxChart(ser,big){
  const W=320,H=big?150:ser.length>1?112:78,pl=10,pr=10,pt=24,pb=24;
  const st=checkinStatus();const lastM=ser.length?ser[ser.length-1].m:0;const nextM=lastM+3;
  const mMax=Math.max(3,nextM);const X=m=>pl+m/mMax*(W-pl-pr);
  const vs=ser.map(p=>p.e);let mn=Math.min(...vs),mx=Math.max(...vs);const pad=Math.max(10,(mx-mn)*.25);mn-=pad;mx+=pad;
  const Y=v=>H-pb-(v-mn)/(mx-mn)*(H-pb-pt);
  const path=ser.map((p,i)=>(i?'L':'M')+X(p.m).toFixed(1)+','+Y(p.e).toFixed(1)).join(' ');
  const months=[...new Set(ser.map(p=>p.m).concat([nextM]))].sort((a,b)=>a-b);
  const lastP=ser[ser.length-1];
  return `<div class="mcwrap"><svg class="chart mc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Max over time">
    <line class="base" x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}"/>
    <line class="nextl" x1="${X(nextM)}" x2="${X(nextM)}" y1="${pt-8}" y2="${H-pb}"/>
    ${months.map(m=>`<text x="${X(m)}" y="${H-7}" text-anchor="${m===mMax?'end':m===0?'start':'middle'}" class="${m===nextM?'nx':''}">${m===nextM?'Next':'Month '+m}</text>`).join('')}
    ${ser.length>1?`<path class="ln" d="${path}"/>`:''}
    ${ser.map((p,i)=>{const lab=i===0||i===ser.length-1;return `<circle class="dot${i===ser.length-1?' last':''}" cx="${X(p.m)}" cy="${Y(p.e)}" r="${i===ser.length-1?5:4}"/>${lab?`<text class="vl" x="${X(p.m)}" y="${Y(p.e)-10}" text-anchor="${p.m===0&&ser.length>1?'start':'middle'}">${num(p.e)}</text>`:''}<circle class="hit" data-act="mc-pt" data-tip="${esc(`Month ${p.m} · ${fmtDate(p.date)}: ${num(p.e)} lb`)}" cx="${X(p.m)}" cy="${Y(p.e)}" r="14"/>`;}).join('')}
  </svg><div class="mctip note">${lastP?`Month ${lastP.m} · ${fmtDate(lastP.date)}: ${num(lastP.e)} lb`:''}</div></div>`;
}
Object.assign(ACT,{'mc-pt':el=>{const t=el.closest('.mcwrap').querySelector('.mctip');if(t)t.textContent=el.dataset.tip;}});
document.addEventListener('pointerover',e=>{const el=e.target.closest&&e.target.closest('.mc .hit');if(el)ACT['mc-pt'](el);});

function exProgressCard(id){
  const ex=getEx(id);const ser=seriesFor(id);if(!ser.length)return '';
  const cur=ser[ser.length-1],prev=ser.length>1?ser[ser.length-2]:null,first=ser[0];
  const d=prev?cur.e-prev.e:0;const cls=d>0?'gup':d<0?'gdn':'';
  return `<div class="pcard" data-act="open-pex" data-id="${id}">
    <div class="pch"><div style="flex:1;min-width:0"><div class="t">${esc(ex.name)}</div><div class="s">${ser.length} check-in${ser.length>1?'s':''}${ex.kind==='bw'?' · incl. body weight':''}</div></div>${icon('chev','chev')}</div>
    ${prev?`<div class="pcstats"><div><span>Previous</span><b>${num(prev.e)}</b></div><div><span>New</span><b>${num(cur.e)}</b></div><div><span>Gained</span><b class="${cls}">${lbTxt(d)}</b></div><div><span>Change</span><b class="${cls}">${pctTxt(cur.e,prev.e)}</b></div></div>`
      :`<div class="pcstats one"><div><span>Starting max</span><b>${num(cur.e)} lb</b></div><div><span>Set on</span><b>${fmtDate(cur.date)}</b></div></div>`}
    ${maxChart(ser)}
    ${ser.length>2?`<div class="note" style="margin-top:2px">Since Month 0: <b class="${cur.e>=first.e?'gup':'gdn'}">${lbTxt(cur.e-first.e)} (${pctTxt(cur.e,first.e)})</b></div>`:''}
  </div>`;
}
function renderProgress(){

  let status;
  if(st.state==='none')status=`<div class="card hero"><div class="tag">Start here</div><h2>Set your starting maxes</h2><div class="meta">Enter your current maxes once. Every 3 months you’ll enter them again and see exactly how much stronger you got.</div><button class="btn pri lg block" style="margin-top:14px" data-act="open-checkin">${icon('calc')} Enter my maxes</button></div>`;

      return swipeRow(`<div class="row tap" style="border-radius:16px;border:1px solid var(--hair)" data-act="open-ck" data-d="${k.date}"><span class="ico">${icon('cal')}</span><div class="grow"><div class="t">${i===c.length-1?'Baseline':'Month '+m} · ${fmtDate(k.date)}</div><div class="s">${n} lift${n===1?'':'s'}</div></div><button class="trash ibtn" data-act="del-ck-btn" data-d="${k.date}" aria-label="Delete">${icon('trash')}</button></div>`,'del-ck',{data:`data-d="${k.date}"`,restored:UI.restored===k.date});}).join('')}</div></div>`:''}`;
  bindSwipes($('#v-progress'));

    const D=UI.ckDraft||{};const saved=[];let needBW=false,bad=false;
    Object.entries(D).forEach(([id,d])=>{const ex=getEx(id);const r=parseInt(d.r,10);const wBlank=d.w===''||d.w==null;

];
function renderTools(){
  $('#v-tools').innerHTML=`<div class="ptitle">Toolkit</div><div class="psub">Everything extra, in one place.</div>
   ${TOOLKIT.map(([h,rows])=>`<div class="sec"><div class="sec-h"><h3>${esc(h)}</h3></div><div class="list">${rows.map(([a,i,t,s])=>`<div class="row tap" data-act="${a}"><span class="ico">${icon(i)}</span><div class="grow"><div class="t">${esc(t)}</div><div class="s">${esc(s)}</div></div>${icon('chev','chev')}</div>`).join('')}</div></div>`).join('')}`;
}
function bodyWeightPage(b){
  const bw=S.bodyLog.slice().sort((a,c)=>a.date<c.date?-1:1);
  b.innerHTML=`<button class="btn pri block" data-act="bw-add">${icon('plus')} Log a weigh-in</button>
   <div class="card" style="margin-top:12px">${lineChart(bw.map(x=>({x:x.date.slice(5).replace('-','/'),y:x.w})))}</div>
   ${bw.length?`<div style="display:flex;flex-direction:column;gap:6px;margin-top:12px">${bw.slice().reverse().map(x=>swipeRow(`<div class="row" style="border-radius:12px;padding:10px 12px;background:var(--raised)"><div class="grow"><b>${x.w} lb</b> <span class="note">${fmtDate(x.date)}</span></div><button class="trash ibtn" data-act="bw-del-btn" data-d="${x.date}">${icon('trash')}</button></div>`,'bw-del',{data:`data-d="${x.date}"`,restored:UI.restored===x.date})).join('')}</div>`:'<div class="note" style="margin-top:10px">Weigh in once a week, same time of day.</div>'}`;
  bindSwipes(b);
}
function achievementsPage(b){
  const L=levelFromXP(S.xp);const nr=nextRank(L.level);const st=streakInfo();
  b.innerHTML=`<div class="card hero"><div class="hero-row"><div style="position:relative">${ringSVG(L.into/L.need,84,'',8)}<div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center"><div><div style="font-family:var(--disp);font-weight:700;font-size:22px;line-height:1">${L.level}</div><div class="eyebrow" style="font-size:9px">level</div></div></div></div>
    <div style="flex:1"><div class="tag">Rank</div><h2>${esc(L.rank)}</h2><div class="meta">${num(S.xp)} XP · ${L.need-L.into} to level ${L.level+1}${nr?` · ${esc(nr.name)} at Lv ${nr.level}`:''}</div></div></div></div>
   <div class="tiles"><div class="tile"><div class="v">🔥 ${st.streak}</div><div class="l">Current streak</div></div><div class="tile"><div class="v">${st.best}</div><div class="l">Best streak</div></div><div class="tile"><div class="v">${S.sessions.length}</div><div class="l">Workouts</div></div></div>
   <div class="sec"><div class="sec-h"><h3>Badges</h3><span class="note">${Object.keys(S.badges).length}/${BADGES.length}</span></div><div class="bgrid">${BADGES.map(bd=>{const [v,t]=bd.prog();const got=!!S.badges[bd.id];return `<div class="bdg${got?' got':''}"><div class="e">${bd.icon}</div><div class="n">${esc(bd.name)}</div><div class="note" style="font-size:10.5px;margin-top:2px">${esc(bd.desc)}</div>${got?'':`<div class="p"><i style="width:${Math.min(100,Math.round(v/t*100))}%"></i></div>`}</div>`;}).join('')}</div></div>
   <div class="note" style="margin-top:12px">Ranks and badges are just for motivation — everything in the app is free.</div>`;
}
Object.assign(ACT,{
  'open-history':()=>openPage('Workout history',b=>{b.innerHTML=historyHTML();bindSwipes(b);}),
  'open-bodyweight':()=>openPage('Body weight',bodyWeightPage),
  'open-achievements':()=>openPage('Achievements',achievementsPage),
  'go-settings':()=>{while(UI.pages.length)closePage();go('profile');},
});

/* ---------- boot ---------- */
window.Demo=(typeof Demo!=='undefined'&&Demo)||null;
function boot(){
  loadState();try{seedMaxLog();migrateCheckins();}catch(e){}applyTheme();
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',applyTheme);}catch(e){}
  UI.view='plan';go('plan');
}
boot();

</script>
</body>
</html>
